    <meta property="og:url" content="https://www.adamfield.org/pages/library.html">

    <link rel="stylesheet" href="/styles/style.css"/>

<body>
    <!-- Header -->
    <header>
        <h1>Library</h1>
    </header>

    <!-- Navigation Bar -->
    <!-- SITE-NAV:START (generated by scripts/layout.py — edit there) -->
    <nav>
        <a href="/index.html">Home</a>
        <a href="/pages/blog.html">Blog</a>
        <a href="/pages/sims.html">Simulations</a>
        <a href="/pages/games.html">Games</a>
        <a href="/pages/courses.html">Courses</a>
        <a href="/pages/library.html" aria-current="page">Library</a>
        <a href="/pages/resume.html">Resume</a>
    </nav>
    <!-- SITE-NAV:END -->

    <div class="container">
        <aside class="sidebar">
            <div id="admin-bar"></div>

            <div id="add-book-wrap" style="display:none; margin: 12px 0;">
                <button id="add-book-btn" class="admin-btn admin-primary">+ Add book</button>
            </div>

            <h2>Filter</h2>
            <div style="margin-bottom: 16px;">
                <label for="search-input" style="font-weight:bold; display:block; margin-bottom:6px;">Search</label>
                <input type="text" id="search-input" placeholder="Title, author, ISBN, subject…"
                       style="width:100%; padding:6px 8px; border:1px solid var(--border,#ccc); border-radius:4px;">
            </div>
            <div style="margin-bottom: 16px;">
                <label for="sort-select" style="font-weight:bold; display:block; margin-bottom:6px;">Sort by</label>
                <select id="sort-select" style="width:100%; padding:6px 8px; border:1px solid var(--border,#ccc); border-radius:4px;">
                    <option value="title-asc">Title A–Z</option>
                    <option value="title-desc">Title Z–A</option>
                    <option value="author-asc">Author A–Z</option>
                    <option value="year-desc">Newest First</option>
                    <option value="year-asc">Oldest First</option>
                </select>
            </div>
            <div id="result-count" style="font-size:0.85rem; color:var(--text-muted,#666); font-style:italic;"></div>
        </aside>

        <div class="content-container">
            <section class="card-container" id="booksContainer">
                <div class="loading" id="loadingIndicator">Loading library…</div>
            </section>
        </div>
    </div>

    <!-- Footer -->
    <!-- SITE-FOOTER:START (generated by scripts/layout.py — edit there) -->
    <footer>
        <div class="footer-content">
            <p>Created by Adam Field</p>
            <div class="footer-socials">
                <span class="contact-label">Contact me:</span>
                <div class="social-icons">
                    <a href="mailto:adfield@wpi.edu" title="Email">
                        <img src="/assets/email_logo.svg" alt="email logo">
                    </a>
                    <a href="https://www.linkedin.com/in/adfield/" target="_blank" title="LinkedIn">
                        <img src="/assets/linkedin_logo.svg" alt="linkedin logo">
                    </a>
                    <a href="https://github.com/AdamField118" target="_blank" title="GitHub">
                        <img src="/assets/github_logo.svg" alt="github logo">
                    </a>
                </div>
            </div>
        </div>
    </footer>
    <!-- SITE-FOOTER:END -->

    <script src="/scripts/admin.js"></script>
    <script src="/scripts/library.js"></script>
</body>
</html>
