<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Adam Field</title>
    <meta name="description" content="Physics and mathematics blog by Adam Field: gravitational lensing, quantum field theory, wave equations, Noether's theorems, and computational astrophysics research notes.">
    <meta name="author" content="Adam Field">
    <link rel="canonical" href="https://www.adamfield.org/pages/blog.html">

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Blog — Adam Field">
    <meta property="og:description" content="Physics and mathematics blog: gravitational lensing, quantum field theory, wave equations, and computational astrophysics research notes.">
    <meta property="og:url" content="https://www.adamfield.org/pages/blog.html">
    <meta property="og:image" content="https://www.adamfield.org/assets/adam.jpg">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="../styles/style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/themes/prism.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/components/prism-latex.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            loader: {
                load: ['output/svg']
            }
        };
    </script>
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Adam's Blog Page</h1>
    </header>
    
    <!-- Navigation Bar -->
    <nav>
        <a href="../index.html">Welcome Page</a>
        <a href="./blog.html">Blog Page</a>
        <a href="./resume.html">Dynamic Resume</a>
    </nav>

    <div class="content-container">
        <div class="controls">
            <button class="sort-btn active" id="sort-newest">Newest First</button>
            <button class="sort-btn" id="sort-oldest">Oldest First</button>
        </div>

        <div class="filter-section">
            <label for="tag-filter">Filter by Tag:</label>
            <select id="tag-filter" class="filter-select">
                <option value="all">All Topics</option>
            </select>
        </div>

        <section class="card-container" id="postsContainer">
            <div class="loading" id="loadingIndicator">
                <i class="fas fa-spinner fa-spin"></i> Loading blog posts...
            </div>
        </section>
    </div>
    
    <div class="close-btn" id="closeBtn">
        <i class="fas fa-times"></i>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>Created by Adam Field</p>
            <div class="footer-socials">
                <span class="contact-label">Contact me:</span>
                <div class="social-icons">
                    <a href="mailto:adfield@wpi.edu" title="Email">
                        <img src="../assets/email_logo.svg" alt="email logo">
                    </a>
                    <a href="https://www.linkedin.com/in/adfield/" target="_blank" title="LinkedIn">
                        <img src="../assets/linkedin_logo.svg" alt="linkedin logo">
                    </a>
                    <a href="https://github.com/AdamField118" target="_blank" title="GitHub">
                        <img src="../assets/github_logo.svg" alt="github logo">
                    </a>
                </div>
            </div>
        </div>
    </footer>
    
    <script src="../scripts/blog.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>
</body>
</html>
