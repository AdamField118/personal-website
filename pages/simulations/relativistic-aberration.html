<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relativistic Aberration — Adam Field</title>
    <meta name="description" content="Fly through a star field near light speed and watch relativistic aberration, Doppler shift, and beaming distort the sky — a real-time WebGL2 simulation derived from the Lorentz transformation.">
    <meta name="author" content="Adam Field">
    <link rel="canonical" href="https://www.adamfield.org/pages/simulations/relativistic-aberration.html">

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Relativistic Aberration — Adam Field">
    <meta property="og:description" content="Real-time relativistic aberration, Doppler shift, and beaming in a WebGL2 shader.">
    <meta property="og:url" content="https://www.adamfield.org/pages/simulations/relativistic-aberration.html">
    <meta property="og:image" content="https://www.adamfield.org/assets/adam.jpg">
    <meta name="twitter:card" content="summary">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LearningResource",
      "name": "Relativistic Aberration",
      "description": "Real-time relativistic aberration, Doppler shift, and beaming in a WebGL2 shader.",
      "url": "https://www.adamfield.org/pages/simulations/relativistic-aberration.html",
      "learningResourceType": "Interactive simulation",
      "educationalLevel": "Undergraduate",
      "author": {"@type": "Person", "name": "Adam Field", "url": "https://www.adamfield.org/"}
    }
    </script>

    <link rel="stylesheet" href="/styles/relativistic.css">
    <style>
        /* Minimal overlay back-link — this sim is full-screen and captures
           the keyboard, so it uses this instead of the sticky site nav. */
        .sim-back {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            font-family: monospace;
            font-size: 0.9rem;
            color: #cfe3ff;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(120, 160, 220, 0.4);
            border-radius: 6px;
            padding: 6px 10px;
            text-decoration: none;
            backdrop-filter: blur(2px);
        }
        .sim-back:hover { background: rgba(0, 0, 0, 0.7); color: #fff; }
    </style>
</head>
<body>

    <a href="/pages/sims.html" class="sim-back">← Simulations</a>

    <!-- WebGL canvas -->
    <canvas id="glCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">

        <!-- Speedometer -->
        <section class="hud-panel" id="speedometer">
            <div class="panel-title">VELOCITY</div>
            <div id="speed-value">0.00000 c</div>
            <div id="speed-bar-track">
                <div id="speed-bar"></div>
            </div>
            <div id="gamma-value">gamma = 1.00000</div>

            <div class="divider"></div>

            <div class="panel-title">DOPPLER  D = f<sub>obs</sub>/f<sub>emit</sub></div>
            <div class="doppler-row">
                <span class="label fwd-label">fwd</span>
                <span id="doppler-fwd" class="fwd-val">1.00000</span>
            </div>
            <div class="doppler-row">
                <span class="label bwd-label">bwd</span>
                <span id="doppler-bwd" class="bwd-val">1.00000</span>
            </div>
        </section>

        <!-- Controls legend -->
        <section class="hud-panel" id="controls">
            <div class="panel-title">CONTROLS</div>
            <div class="ctrl-row"><kbd>SPACE</kbd><span class="ctrl-desc">accelerate (hold)</span></div>
            <div class="ctrl-row"><kbd>SHIFT</kbd><kbd>SPACE</kbd><span class="ctrl-desc">decelerate (hold)</span></div>
            <div class="ctrl-row"><kbd>W</kbd><kbd>S</kbd><span class="ctrl-desc">look up / down</span></div>
            <div class="ctrl-row"><kbd>A</kbd><kbd>D</kbd><span class="ctrl-desc">look left / right</span></div>
            <div class="ctrl-row"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><span class="ctrl-desc">look</span></div>
            <div class="ctrl-row"><kbd>G</kbd><span class="ctrl-desc">toggle grid</span></div>
        </section>

    </div>

    <script src="/scripts/relativistic/main.js" type="module"></script>
</body>
</html>
