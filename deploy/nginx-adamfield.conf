# nginx server block for www.adamfield.org (personal website)
#
# Assumes TLS terminates at Cloudflare and nginx serves the origin on the
# Raspberry Pi. If nginx itself terminates TLS (Cloudflare "Full (strict)"
# with an origin certificate), add the usual listen 443 ssl + certificate
# directives. See deploy/README.md for Cloudflare-side settings.

server {
    listen 80;
    listen [::]:80;
    server_name www.adamfield.org adamfield.org;

    root /var/www/personal-website;   # adjust to your checkout path
    index index.html;

    # ── Custom error page ────────────────────────────────────────────────
    error_page 404 /404.html;

    # ── Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json
               application/rss+xml image/svg+xml text/plain;
    # If your nginx build has the brotli module, also enable:
    # brotli on;
    # brotli_types text/css application/javascript application/json
    #              application/rss+xml image/svg+xml text/plain;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Enable HSTS only once you're sure everything is HTTPS-only:
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: self-hosted assets + the two remaining third parties
    # (MathJax from cdnjs, YouTube thumbnails/embeds).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self'; object-src 'none'; base-uri 'self'" always;

    # ── Caching ──────────────────────────────────────────────────────────
    # HTML and feeds: always revalidate so content updates show up promptly.
    location ~* \.(html|xml|json|txt)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Static assets: cache for a week at the edge/browser. Assets are not
    # content-hashed, so avoid "immutable" / year-long lifetimes.
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|mp4|webm|pdf|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
