# 301 redirects from the old subdomains into the consolidated site.
#
# Use this if the subdomains reach your Pi's nginx (they resolve to the same
# origin). Drop it in /etc/nginx/sites-available/, symlink into sites-enabled,
# `nginx -t && systemctl reload nginx`. If instead the subdomains are served by
# Cloudflare Pages / another origin, use deploy/cloudflare-redirect-rules.md.
#
# TLS terminates at Cloudflare in the default setup, so these listen on :80.

# portfolio.adamfield.org → Simulations. Simulation deep links are preserved
# (the new paths are identical: /pages/simulations/<slug>.html).
server {
    listen 80;
    listen [::]:80;
    server_name portfolio.adamfield.org;

    # Keep existing simulation deep links working verbatim.
    location /pages/simulations/ {
        return 301 https://www.adamfield.org$request_uri;
    }
    # Everything else on the old portfolio → the Simulations index.
    location / {
        return 301 https://www.adamfield.org/pages/sims.html;
    }
}

# magic8ball.adamfield.org → the Magic 8-Ball game.
server {
    listen 80;
    listen [::]:80;
    server_name magic8ball.adamfield.org;
    return 301 https://www.adamfield.org/pages/games/magic-8-ball.html;
}

# library.adamfield.org → the Library.
server {
    listen 80;
    listen [::]:80;
    server_name library.adamfield.org;
    return 301 https://www.adamfield.org/pages/library.html;
}

# comphys.adamfield.org → Courses (its notes now live under Courses; its blog
# write-ups live under the Blog). The code stays in the computational_physics_isp
# repo, which is no longer a website.
server {
    listen 80;
    listen [::]:80;
    server_name comphys.adamfield.org;
    return 301 https://www.adamfield.org/pages/courses.html;
}
