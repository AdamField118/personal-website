<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Magic 8-Ball">
  <defs>
    <radialGradient id="bg8" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#062036"/>
      <stop offset="100%" stop-color="#02101e"/>
    </radialGradient>
    <radialGradient id="ball8" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="45%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg8)"/>
  <circle cx="200" cy="125" r="92" fill="url(#ball8)"/>
  <ellipse cx="172" cy="92" rx="30" ry="15" fill="#ffffff" opacity="0.18" transform="rotate(-18 172 92)"/>
  <!-- blue answer triangle -->
  <polygon points="200,168 168,110 232,110" fill="#0a5ea8"/>
  <text x="200" y="140" text-anchor="middle" fill="#eaf6ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">YES</text>
</svg>
