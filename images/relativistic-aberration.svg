<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Relativistic aberration: stars streaking toward a vanishing point">
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1830"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bcd4ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5a86d6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a86d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sky)"/>
  <!-- forward blueshift glow at the heading -->
  <circle cx="200" cy="125" r="70" fill="url(#core)"/>
  <!-- aberration streaks radiating from the vanishing point -->
  <g stroke-linecap="round">
    <line x1="200" y1="125" x2="40"  y2="30"  stroke="#8fb6ff" stroke-width="2.2" opacity="0.8"/>
    <line x1="200" y1="125" x2="120" y2="10"  stroke="#a9c7ff" stroke-width="1.8" opacity="0.7"/>
    <line x1="200" y1="125" x2="300" y2="8"   stroke="#c9dbff" stroke-width="1.6" opacity="0.7"/>
    <line x1="200" y1="125" x2="384" y2="40"  stroke="#8fb6ff" stroke-width="2.2" opacity="0.8"/>
    <line x1="200" y1="125" x2="392" y2="150" stroke="#7aa6ff" stroke-width="2.4" opacity="0.75"/>
    <line x1="200" y1="125" x2="320" y2="238" stroke="#6f8fdd" stroke-width="2" opacity="0.6"/>
    <line x1="200" y1="125" x2="110" y2="240" stroke="#ff9a6b" stroke-width="2" opacity="0.55"/>
    <line x1="200" y1="125" x2="14"  y2="200" stroke="#ff8c5a" stroke-width="2.4" opacity="0.6"/>
    <line x1="200" y1="125" x2="8"   y2="110" stroke="#e0b090" stroke-width="1.8" opacity="0.55"/>
  </g>
  <!-- scattered stars, redshifted toward the trailing edge -->
  <g fill="#ffffff">
    <circle cx="60"  cy="60"  r="1.6"/>
    <circle cx="150" cy="45"  r="1.2"/>
    <circle cx="270" cy="40"  r="1.4"/>
    <circle cx="340" cy="80"  r="1.2"/>
    <circle cx="90"  cy="150" r="1.3"/>
  </g>
  <g fill="#ffb488">
    <circle cx="120" cy="205" r="1.6"/>
    <circle cx="250" cy="210" r="1.3"/>
    <circle cx="60"  cy="180" r="1.2"/>
  </g>
  <circle cx="200" cy="125" r="3" fill="#eaf2ff"/>
</svg>
